      .sw-copy { left: clamp(18px, 5vw, 64px); right: clamp(18px, 5vw, 64px); top: auto; bottom: clamp(64px, 14vh, 120px); transform: none; width: auto; max-width: 560px; }
      .sw-copy { bottom: calc(clamp(56px, 12dvh, 110px) + env(safe-area-inset-bottom)); }
      .sw-copy__title { font-size: clamp(1.9rem, 7.5vw, 2.7rem); }
      .sw-copy__body { max-width: none; font-size: clamp(.98rem, 3.6vw, 1.1rem); }
      .sw-hint { bottom: calc(20px + env(safe-area-inset-bottom)); }
      .sw-route { gap: 16px; right: 6px; }

      ground.rotation.x = -Math.PI / 2;
      ground.position.y = 0;
      ground.receiveShadow = !coarse;
      scene3d.add(ground);

      // helpers
      function clay(color) { return new THREE.MeshStandardMaterial({ color: color, roughness: 0.92, metalness: 0, flatShading: true }); }
      function box(mat, w, h, d, x, y, z, ry) {
        var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
        m.position.set(x, y, z);
        if (ry) m.rotation.y = ry;
        m.castShadow = !coarse;
        return m;
      }
      function cyl(mat, r, h, x, y, z, rTop) {
        var m = new THREE.Mesh(new THREE.CylinderGeometry(rTop != null ? rTop : r, r, h, 32), mat);
        m.position.set(x, y, z);
        m.castShadow = !coarse;
        return m;
      }
      function sph(mat, r, x, y, z) {
        var m = new THREE.Mesh(new THREE.SphereGeometry(r, 28, 20), mat);
        m.position.set(x, y, z);
        m.castShadow = !coarse;
        return m;
      }
      function grp() { var g = new THREE.Group(); scene3d.add(g); return g; }

      var islandMat = clay(0xEFE3D2);
      var darkMat = clay(0xD9C8AE);
      var inkMat = clay(0x241D2B);
      var whiteMat = clay(0xFFFCF5);
      var matF = clay(0xE879F9), matC = clay(0x22D3EE), matV = clay(0x8B5CF6);
      var matP = clay(0xF472B6), matG = clay(0xFBBF24), matE = clay(0x34D399);
      var matR = clay(0xEE5A3C), matB = clay(0x2496ED), matM = clay(0xA78BFA);

      var SPACING = 38;
      var g;

      function addScreen(mat, x, y, z, s, glow) {
        var gg = grp();
        gg.position.set(x, y, z);
        var frame = box(inkMat, 3.1 * s, 2.1 * s, 0.35 * s, 0, 0, 0);
        gg.add(frame);
        var scr = box(glow, 2.55 * s, 1.55 * s, 0.08 * s, 0, 0.02 * s, 0.2 * s);
        gg.add(scr);
        var stand = box(inkMat, 1.1 * s, 0.4 * s, 0.7 * s, 0, -1.2 * s, 0.1 * s);
        gg.add(stand);
        var foot = box(darkMat, 1.7 * s, 0.16 * s, 1.1 * s, 0, -1.48 * s, 0.1 * s);
        gg.add(foot);
        return gg;
      }

      SECTIONS.forEach(function (s, i) {
        var X = i * SPACING;
        var island = cyl(islandMat, 6.4, 1.1, X, 0.55, 0);
        scene3d.add(island);
        var lip = cyl(darkMat, 6.4, 0.22, X, 1.15, 0, 6.2);
        scene3d.add(lip);
        var g2 = grp();
        g2.position.x = X;

        if (i === 0) {
          var term = addScreen(matF, 0, 2.6, 0, 1.35, matF);
          term.position.y = 2.6;
          g2.add(term);
          var nameB = box(matF, 2.1, 0.5, 0.5, 0, 4.0, 1.1);
          g2.add(nameB);
          var stack1 = box(inkMat, 2.3, 2.0, 0.95, 2.9, 1.0, 0.4);
          g2.add(stack1);
          var stack2 = box(darkMat, 2.3, 0.6, 0.95, 2.9, 2.3, 0.4);
          g2.add(stack2);
          var led1 = box(matC, 0.22, 0.22, 0.14, 3.9, 2.4, 0.87);
          g2.add(led1);
          var led2 = box(matG, 0.22, 0.22, 0.14, 3.4, 2.4, 0.87);
          g2.add(led2);
          var led3 = box(matF, 0.22, 0.22, 0.14, 2.9, 2.4, 0.87);
          g2.add(led3);
          var side = box(darkMat, 1.5, 2.6, 1.0, -3.0, 1.3, 0.6);
          g2.add(side);
          var ring = new THREE.Mesh(new THREE.TorusGeometry(2.6, 0.09, 12, 48), clay(0xF5C6FB));
          ring.position.set(0, 2.5, 0.4);
          ring.rotation.x = 0.4;
          g2.add(ring);
          var beacon = cyl(matF, 0.16, 2.2, 3.0, 3.9, -2.8);
          g2.add(beacon);
          var star = sph(matG, 0.42, 3.0, 5.1, -2.8);
          g2.add(star);
          s.fx = 0; s.fy = 2.6;
        }

        if (i === 1) {
          var books = grp();
          books.position.set(0, 1.15, 0);
          books.add(box(matC, 1.9, 0.42, 0.5, 0, 0.21, 0));
          books.add(box(matV, 1.9, 0.42, 0.5, 0.1, 0.63, 0));
          books.add(box(matF, 1.9, 0.42, 0.5, -0.05, 1.05, 0));
          books.add(box(matE, 1.9, 0.42, 0.5, 0.05, 1.47, 0));
          g2.add(books);
          var capBase = box(inkMat, 2.3, 0.18, 1.9, -2.7, 1.4, -1.3);
          g2.add(capBase);
          var capTop = box(matV, 1.4, 0.5, 1.0, -2.7, 1.95, -1.3, Math.PI / 4);
          g2.add(capTop);
          var tassel = sph(matG, 0.2, -3.3, 2.1, -2.1);
          g2.add(tassel);
          var term2 = addScreen(matC, 2.7, 2.4, 1.2, 0.85, matC);
          g2.add(term2);
          var brain = sph(matP, 0.95, 0, 2.5, -2.2);
          g2.add(brain);
          var blob = sph(matF, 0.5, 0.9, 2.9, -2.6);
          g2.add(blob);
          s.fx = 0; s.fy = 1.5;
        }

        if (i === 2) {
          var rack1 = box(inkMat, 2.0, 3.3, 1.0, -1.7, 1.65, 0.3);
          g2.add(rack1);
          [[matC, -2.5], [matG, -1.7], [matF, -0.9]].forEach(function (p) {
            var led = box(p[0], 0.2, 0.2, 0.16, p[1], 3.0, 0.78);
            g2.add(led);
          });
          var rack2 = box(darkMat, 2.0, 3.3, 1.0, 2.4, 1.65, -0.2);
          g2.add(rack2);
          var brim = cyl(matR, 1.5, 0.2, 0, 1.6, 1.8);
          g2.add(brim);
          var dome = cyl(matR, 1.1, 1.2, 0, 2.3, 1.8, 0.55);
          g2.add(dome);
          var band = box(whiteMat, 0.5, 1.3, 0.5, 0, 2.3, 1.8);
          g2.add(band);
          var badge = cyl(matG, 0.5, 0.14, 1.0, 1.4, 1.9);
          g2.add(badge);
          var desk = box(darkMat, 3.4, 0.24, 1.5, 0, 1.1, -1.4);
          g2.add(desk);
          var book2 = box(matE, 1.6, 0.3, 0.9, -0.6, 1.35, -1.4);
          g2.add(book2);
          s.fx = 0; s.fy = 2.0;
        }

        if (i === 3) {
          var cont = box(matB, 2.1, 1.5, 1.5, -2.4, 1.25, 0.2);
          g2.add(cont);
          var contTop = box(whiteMat, 2.1, 0.5, 1.5, -2.4, 2.25, 0.2);
          g2.add(contTop);
          var stripe = box(matC, 0.3, 1.6, 1.56, -1.55, 1.35, 0.2);
          g2.add(stripe);
          var rack3 = box(inkMat, 2.0, 3.2, 1.0, 2.5, 1.6, -0.4);
          g2.add(rack3);
          var term3 = addScreen(matP, 0.2, 2.6, 1.4, 0.8, matP);
          g2.add(term3);
          var node = sph(matV, 0.85, -0.6, 3.2, -2.4);
          g2.add(node);
          var n1 = sph(matF, 0.3, 0.3, 3.4, -2.6);
          g2.add(n1);
          var n2 = sph(matC, 0.3, -1.5, 3.4, -2.6);
          g2.add(n2);
          var link = box(whiteMat, 0.14, 0.14, 0.9, -0.15, 3.3, -2.5, Math.PI / 2);
          g2.add(link);
          s.fx = 0; s.fy = 1.8;
        }

        if (i === 4) {
          var hub = sph(matG, 1.0, 0, 2.6, 0.2);
          g2.add(hub);
          var orbit = [
            [2.6, 0.4], [-2.6, 0.4], [0, 2.6], [0, -2.2], [1.8, -1.6], [-1.8, -1.6]
          ];
          orbit.forEach(function (p, k) {
            var m = [matF, matC, matV, matP, matE, matB][k];
            var s = sph(m, 0.34, p[0], 2.8 + p[1] * 0.15, p[1]);
            g2.add(s);
            var lx = p[0] * 0.5, lz = p[1] * 0.5;
            var d = Math.sqrt(p[0] * p[0] + (p[1] - 0.2) * (p[1] - 0.2)) * 0.9;
            var rod = box(whiteMat, 0.09, 0.09, d, lx, 2.8 + p[1] * 0.1, (0.2 + p[1]) * 0.5 + 0.2, Math.atan2(p[1] - 0.2, p[0]));
            g2.add(rod);
          });
          var paper = box(whiteMat, 2.6, 0.18, 1.8, -2.8, 1.25, -1.8, 0.08);
          g2.add(paper);
          var paper2 = box(darkMat, 2.6, 0.18, 1.8, -2.6, 1.5, -1.8, -0.06);
          g2.add(paper2);
          var stripe2 = box(matE, 0.5, 0.19, 1.82, -3.3, 1.34, -1.8, 0.08);
          g2.add(stripe2);
          s.fx = 0; s.fy = 2.2;
        }

        if (i === 5) {
          var building = box(whiteMat, 3.0, 2.8, 3.0, 0, 1.5, 0);
          g2.add(building);
          var win1 = box(matC, 1.0, 0.9, 0.15, -0.8, 1.9, 1.5);
          g2.add(win1);
          var win2 = box(matG, 1.0, 0.9, 0.15, 0.8, 1.9, 1.5);
          g2.add(win2);
          var door = box(matV, 0.8, 1.2, 0.15, 0, 0.7, 1.5);
          g2.add(door);
          var sign = box(matF, 1.6, 0.5, 0.18, 0, 3.15, 1.5);
          g2.add(sign);
          var camBody = cyl(inkMat, 0.7, 0.8, 2.7, 1.9, -1.6);
          g2.add(camBody);
          var lens = sph(matC, 0.42, 2.7, 1.9, -1.15);
          g2.add(lens);
          var tripod = cyl(darkMat, 0.08, 1.1, 2.7, 0.6, -1.6);
          g2.add(tripod);
          var mon = box(inkMat, 2.4, 1.6, 0.3, -2.6, 2.5, -1.9);
          g2.add(mon);
          var ms = box(matE, 2.0, 1.2, 0.1, -2.6, 2.5, -1.75);
          g2.add(ms);
          var mstand = box(darkMat, 1.4, 0.16, 0.5, -2.6, 1.4, -1.9);
          g2.add(mstand);
          s.fx = 0; s.fy = 1.6;
        }

        if (i === 6) {
          var env = box(matF, 2.7, 1.9, 0.24, -1.2, 2.1, 0.4, 0.05);
          g2.add(env);
          var flap = new THREE.Mesh(new THREE.PlaneGeometry(2.7, 0.95), clay(0xF5C6FB));
          flap.position.set(-1.2, 2.1, 0.53);
          flap.rotation.x = Math.PI * 0.32;
          g2.add(flap);
          var globe = sph(matC, 0.95, 1.7, 2.5, -1.9);
          g2.add(globe);
          var orbitR = new THREE.Mesh(new THREE.TorusGeometry(1.5, 0.08, 10, 40), clay(0x9BE8F7));
          orbitR.position.set(1.7, 2.5, -1.9);
          orbitR.rotation.y = 0.6;
          orbitR.rotation.x = 1.0;
          g2.add(orbitR);
          var bubble = sph(whiteMat, 0.8, 0.4, 2.2, -3.2);
          g2.add(bubble);
          var b1 = sph(matG, 0.16, 1.1, 2.4, -2.9);
          g2.add(b1);
          var b2 = sph(matF, 0.16, 0.9, 2.05, -3.5);
          g2.add(b2);
          var heart = box(matR, 1.1, 0.9, 0.9, -3.4, 1.7, -2.4);
          g2.add(heart);
          var post = cyl(inkMat, 0.14, 1.6, -1.2, 0.8, 0.4);
          g2.add(post);
          s.fx = 0; s.fy = 2.0;
        }
      });

      // camera beats: approach + dive per scene
      var posBeats = [], lookBeats = [];
      SECTIONS.forEach(function (s, i) {
        var X = i * SPACING;
        if (i === 0) {
          posBeats.push(new THREE.Vector3(X - 16, 13, 24));
          lookBeats.push(new THREE.Vector3(X, 2.2, 0));
        } else {
          posBeats.push(new THREE.Vector3(X + 7, 9.5, 15.5));
          lookBeats.push(new THREE.Vector3(X, 2.4, 0));
        }
        posBeats.push(new THREE.Vector3(X + s.fx + 1.4, 3.2 + s.fy, 5.4));
        lookBeats.push(new THREE.Vector3(X + s.fx, 1.9 + s.fy, 0));
      });
      beats = posBeats;
      var posCurve = new THREE.CatmullRomCurve3(posBeats, false, 'catmullrom', 0.6);
      var lookCurve = new THREE.CatmullRomCurve3(lookBeats, false, 'catmullrom', 0.6);
      path = posCurve; lookPath = lookCurve;

      // u at each beat (arc-length)
      var lens = path.getLengths(400);
      var totalLen = lens[lens.length - 1];
      uBeats = posBeats.map(function (p) {
        var best = 0, bd = Infinity;
        for (var k = 0; k <= 400; k++) {
          var d = path.getPoint(k / 400).distanceToSquared(p);
          if (d < bd) { bd = d; best = k / 400; }
        }
        return best;
      });

      worldOK = true;
    }

    // scroll fraction -> u on the camera path
    var uOfProg = null;
    function buildUMap() {
      // cumulative units of each beat
      var cum = [], off = 0;
      for (var i = 0; i < beats.length; i++) {
        cum.push(off);
        off += (i % 2 === 0) ? DIVE : CONN;
      }
      var tot = off;
      var u = uBeats, c = cum;
      uOfProg = function (t) {
        t = clamp(t, 0, 1);
        if (t <= 0) return u[0];
        if (t >= 1) return u[u.length - 1];
        for (var i = 0; i < c.length - 1; i++) {
          var p0 = c[i] / tot, p1 = c[i + 1] / tot;
          if (t >= p0 && t <= p1) {
            var f = (t - p0) / (p1 - p0);
            return u[i] + (u[i + 1] - u[i]) * f;
          }
        }
        return u[u.length - 1];
      };
    }

    function onResize() {
      vh = window.innerHeight;
      track.style.height = (totalUnits * vh) + 'px';
      if (camera) {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
      read();
    }

    var ticking = false, activeIndex = -1, reducedPos = null;

    function read() {
      var y = window.scrollY || window.pageYOffset;
      var prog = clamp(y / (totalUnits * vh), 0, 1);

      // copy
      for (var i = 0; i < N; i++) {
        var seg = SEG[i * 2];
        var pr = clamp((y - seg.start * vh) / ((seg.end - seg.start) * vh), 0, 1);
        var cop;
        if (i === 0) cop = (y > seg.end * vh) ? 0 : smooth(1 - pr / 0.62);
        else if (i === N - 1) cop = (y < seg.start * vh) ? 0 : smooth(pr / 0.4);
        else cop = (y < seg.start * vh || y > seg.end * vh) ? 0 : smooth(1 - Math.abs(pr - 0.5) / 0.5);
        var c = copies[i];
        c.style.opacity = cop;
        c.style.transform = reduce ? 'none' : 'translateY(' + ((0.5 - pr) * 4).toFixed(2) + 'vh)';
        c.style.pointerEvents = cop > 0.5 ? 'auto' : 'none';
      }

      // active scene
      var near = 0;
      for (var k = 0; k < SEG.length; k++) {
        if (y >= SEG[k].start * vh) near = SEG[k].si != null ? SEG[k].si : near;
      }
      if (near !== activeIndex) {
        activeIndex = near;
        dots.forEach(function (d, di) { d.classList.toggle('is-active', di === near); });
        navItems.forEach(function (n, ni) { n.classList.toggle('is-active', ni === near); });
        document.documentElement.style.setProperty('--sw-accent', SECTIONS[near].accent);
      }

      fill.style.transform = 'scaleX(' + clamp(y / (totalUnits * vh)).toFixed(4) + ')';
      hint.style.opacity = clamp(1 - y / (0.5 * vh));

      // camera
      if (worldOK && !reduce) {
        var u = uOfProg(prog);
        var p = path.getPoint(u);
        camera.position.copy(p);
        var l = lookPath.getPoint(u);
        camera.lookAt(l);
        renderer.render(scene3d, camera);
      } else if (worldOK && reduce) {
        var Xr = 0;
        camera.position.set(Xr, 26, 34);
        camera.lookAt(Xr, 0, 0);
        renderer.render(scene3d, camera);
      }

      ticking = false;
    }

    function onScroll() {
      if (!ticking) { ticking = true; requestAnimationFrame(read); }
    }

    buildWorld();
    buildUMap();
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onResize);
    window.addEventListener('load', onResize);
    onResize();
  })();
  </script>
</body>
</html>
